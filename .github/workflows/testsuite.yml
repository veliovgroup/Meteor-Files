name: Test suite

on:
  push:
    branches: [master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Meteor ${{ matrix.meteor-release }} package tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        meteor-release: ['3.2.2', '3.5.2']
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-meteor-${{ matrix.meteor-release }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-meteor-${{ matrix.meteor-release }}-

      - name: Setup meteor
        uses: meteorengineer/setup-meteor@v3
        with:
          meteor-release: ${{ matrix.meteor-release }}

      - run: meteor npm ci
      - run: meteor npm run test:mocha
